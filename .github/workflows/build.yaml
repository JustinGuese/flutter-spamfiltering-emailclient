name: Build & Release

# PRs & main: fast checks only (analyze + tests). Full 5-platform builds
# and GitHub Release run ONLY on v* tags.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'README.md'
      - 'screenshots/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'README.md'
      - 'screenshots/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# New pushes cancel superseded runs, except tag runs (never cancel a release).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Pinned so a new Flutter release cannot break CI without a commit. Bump deliberately.
  FLUTTER_VERSION: '3.50.0'

jobs:
  # 1. Fast gate: runs on PRs, main and tags
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true

    - name: spam_core tests
      working-directory: packages/spam_core
      run: |
        dart pub get
        dart test

    - name: App analyze & test
      working-directory: app
      run: |
        flutter pub get
        flutter analyze
        flutter test

  # 2. Parallel matrix build across all 5 platforms (tags only)
  build:
    name: Build ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: analyze-and-test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    strategy:
      fail-fast: false # Don't cancel Windows/Android if iOS fails
      matrix:
        include:
        - target: android
          os: ubuntu-latest
          # APK (not AAB): installable for sideloading. Signed with the debug key
          # until a release keystore is wired into app/android/app/build.gradle.kts,
          # so it is NOT uploadable to Google Play.
          build_cmd: flutter build apk --release
        - target: linux
          os: ubuntu-latest
          build_cmd: flutter build linux --release
        - target: windows
          os: windows-latest
          build_cmd: flutter build windows --release
        - target: macos
          os: macos-latest
          build_cmd: flutter build macos --release
        - target: ios
          os: macos-latest
          # Unsigned: not installable on devices until signing is set up
          # (see the flutter-ios-codemagic setup); swap for 'flutter build ipa' then.
          build_cmd: flutter build ios --release --no-codesign

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      if: matrix.target == 'android'
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: 'gradle'

    - name: Configure Gradle mirror
      if: matrix.target == 'android'
      run: |
        mkdir -p ~/.gradle/init.d
        cat << 'EOF' > ~/.gradle/init.d/mirror.gradle
        def mirrorUrl = uri("https://maven-central.storage-download.googleapis.com/maven2/")
        gradle.beforeSettings { settings ->
            settings.pluginManagement.repositories.all { repo ->
                if (repo instanceof MavenArtifactRepository) {
                    def u = repo.url.toString()
                    if (u.contains("repo.maven.apache.org") || u.contains("repo1.maven.org")) {
                        repo.url = mirrorUrl
                    }
                }
            }
            try {
                settings.dependencyResolutionManagement.repositories.all { repo ->
                    if (repo instanceof MavenArtifactRepository) {
                        def u = repo.url.toString()
                        if (u.contains("repo.maven.apache.org") || u.contains("repo1.maven.org")) {
                            repo.url = mirrorUrl
                        }
                    }
                }
            } catch (Throwable ignored) {}
        }
        allprojects {
            buildscript {
                repositories.all { repo ->
                    if (repo instanceof MavenArtifactRepository) {
                        def u = repo.url.toString()
                        if (u.contains("repo.maven.apache.org") || u.contains("repo1.maven.org")) {
                            repo.url = mirrorUrl
                        }
                    }
                }
            }
            repositories.all { repo ->
                if (repo instanceof MavenArtifactRepository) {
                    def u = repo.url.toString()
                    if (u.contains("repo.maven.apache.org") || u.contains("repo1.maven.org")) {
                        repo.url = mirrorUrl
                    }
                }
            }
        }
        EOF

    # Linux desktop needs GTK/Ninja; flutter_secure_storage needs libsecret
    - name: Install Linux dependencies
      if: matrix.target == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libjsoncpp-dev

    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true

    - run: flutter pub get

    # Compile-time defines (Firebase, RevenueCat, OAuth client IDs) come from the
    # BILLING_DEFINES_JSON / OAUTH_DEFINES_JSON repo secrets: each holds the whole
    # gitignored app/*.defines.json file. Passed via env so the JSON is never
    # interpolated into the script. bash on every runner (Windows defaults to pwsh).
    - name: Write defines files
      shell: bash
      env:
        BILLING_DEFINES_JSON: ${{ secrets.BILLING_DEFINES_JSON }}
        OAUTH_DEFINES_JSON: ${{ secrets.OAUTH_DEFINES_JSON }}
      run: |
        printf '%s' "${BILLING_DEFINES_JSON:-{\}}" > billing.defines.json
        printf '%s' "${OAUTH_DEFINES_JSON:-{\}}" > oauth.defines.json

    - name: Build ${{ matrix.target }}
      shell: bash
      run: ${{ matrix.build_cmd }} --dart-define-from-file=billing.defines.json --dart-define-from-file=oauth.defines.json

    # Package each platform into a single release-ready file under dist/
    - name: Package android
      if: matrix.target == 'android'
      run: |
        mkdir -p dist
        cp build/app/outputs/flutter-apk/app-release.apk dist/DataFortress-Mail-android.apk

    - name: Package linux
      if: matrix.target == 'linux'
      run: |
        mkdir -p dist
        tar -czf dist/DataFortress-Mail-linux-x64.tar.gz -C build/linux/x64/release/bundle .

    - name: Package windows
      if: matrix.target == 'windows'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force dist | Out-Null
        Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/DataFortress-Mail-windows-x64.zip

    - name: Package macos
      if: matrix.target == 'macos'
      run: |
        mkdir -p dist
        APP=$(ls -d build/macos/Build/Products/Release/*.app | head -n 1)
        ditto -c -k --sequesterRsrc --keepParent "$APP" dist/DataFortress-Mail-macos.zip

    - name: Package ios
      if: matrix.target == 'ios'
      run: |
        mkdir -p dist/Payload
        cp -R build/ios/iphoneos/Runner.app dist/Payload/
        (cd dist && zip -qry DataFortress-Mail-ios-unsigned.ipa Payload && rm -rf Payload)

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-${{ matrix.target }}
        path: app/dist/*
        if-no-files-found: error
        # Tag builds are republished as release assets; keep the rest short-lived.
        retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 7 }}

  # 3. Publish a GitHub Release for v* tags once every platform built
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        pattern: app-*
        merge-multiple: true

    - name: Create release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
      run: |
        ls -l dist
        # Tags like v1.2.0-beta.1 are published as pre-releases.
        PRE=""
        case "$TAG" in *-*) PRE="--prerelease" ;; esac
        gh release create "$TAG" dist/* \
          --repo "$GITHUB_REPOSITORY" \
          --title "$TAG" \
          --generate-notes \
          $PRE
